{% extends "base.html" %}
{% block content %}
<h2>Register</h2>
<form method="post">{{ form.csrf_token }}
  {% for f in [form.username, form.email, form.password, form.password2] %}{% with field=f %}{% include "_form_field.html" %}{% endwith %}{% endfor %}
  {{ form.submit() }}
</form>
{% endblock %}
